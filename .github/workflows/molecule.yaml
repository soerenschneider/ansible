name: "molecule"
on:
  push:
    branches:
      - "master"
      - "main"
    paths:
      - "roles/**"
      - "requirements.yml"
      - "requirements-molecule.txt"
      - "Makefile"
      - ".github/workflows/molecule.yaml"
  pull_request:
    paths:
      - "roles/**"
      - "requirements.yml"
      - "requirements-molecule.txt"
      - "Makefile"
      - ".github/workflows/molecule.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "molecule-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  molecule:
    name: "Molecule"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"

      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-molecule.txt"

      - name: "Run molecule"
        run: |
          make molecule PYTHON=python
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
