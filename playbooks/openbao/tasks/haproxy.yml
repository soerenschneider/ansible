---
- name: "Copy OpenBao deployment cert hook"
  ansible.builtin.template:
    src: "certbot-deploy-openbao.sh.j2"
    dest: "/etc/letsencrypt/renewal-hooks/deploy/certbot-deploy-openbao.sh"
    owner: "root"
    group: "root"
    mode: "0755"
  notify: "Run letsencrypt hook for openbao"
  tags: [haproxy, openbao, openbao-cert]

- name: Including role
  ansible.builtin.include_role:
    name: haproxy
  tags: always

- name: Find certbot deploy hooks
  ansible.builtin.find:
    paths: /etc/letsencrypt/renewal-hooks/deploy
    file_type: file
  register: _openbao_certbot_deploy_hooks
  tags: [haproxy, openbao, openbao-cert]

- name: Run certbot deploy hooks
  ansible.builtin.command: "{{ item.path }}"
  loop: "{{ _openbao_certbot_deploy_hooks.files | selectattr('xusr') | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: true
  tags: [haproxy, openbao, openbao-cert]

- name: Deploy haproxy config
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reload haproxy
  tags: haproxy

- name: Ensure haproxy is running
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
  tags: haproxy
