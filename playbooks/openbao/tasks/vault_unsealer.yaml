---
- name: "Add credentials"
  tags: [openbao, bao-unsealer, vault-unsealer]
  when:
    - vault_unsealer_kms_aws_credentials is defined
    - inventory_hostname in vault_unsealer_kms_aws_credentials
  block:
    - name: "Decrypt AWS secret access key"
      ansible.builtin.shell:
        cmd: "set -o pipefail; base64 --decode | gpg --homedir {{ baseline_gpg_home }} --quiet --batch --decrypt"
        executable: "/bin/bash"
        stdin: "{{ vault_unsealer_kms_aws_credentials[inventory_hostname].aws_secret_access_key_encrypted }}"
        stdin_add_newline: false
      register: _openbao_kms_aws_decrypted
      become: true
      become_user: root
      changed_when: false
      check_mode: false
      no_log: false

    - name: "Set AWS credentials for this host"
      ansible.builtin.set_fact:
        _openbao_kms_aws_access_key_id: "{{ vault_unsealer_kms_aws_credentials[inventory_hostname].aws_access_key_id }}"
        _openbao_kms_aws_secret_access_key: "{{ _openbao_kms_aws_decrypted.stdout }}"
      no_log: true

    - name: "Write AWS credentials"
      ansible.builtin.copy:
        dest: "{{ vault_unsealer_env_file }}"
        owner: "openbao"
        group: "openbao"
        mode: "0600"
        content: |
          AWS_ACCESS_KEY_ID={{ _openbao_kms_aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY={{ _openbao_kms_aws_secret_access_key }}
      no_log: true

- name: "Create vault-unsealer systemd drop-in directory"
  ansible.builtin.file:
    path: "/etc/systemd/system/vault-unsealer.service.d"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [openbao, bao-unsealer, vault-unsealer]

- name: "Add vault-unsealer systemd override to load secret-id credential"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/vault-unsealer.service.d/override.conf"
    content: |
      # Managed by Ansible
      [Service]
      LoadCredential=secret-id:{{ vault_machine_secret_id }}
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart vault-unsealer"
  tags: [openbao, bao-unsealer, vault-unsealer]
