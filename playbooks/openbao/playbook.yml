---
- name: "Setup OpenBAO cluster"
  hosts: "openbao"
  become: true
  tasks:
    - name: "Print user info"
      ansible.builtin.debug:
        msg: "User is: {{ ansible_user }}"

    - name: "Run role platform"
      ansible.builtin.include_role:
        name: "platform"
      tags: always

    - name: "Run tasks haproxy.yml"
      ansible.builtin.include_tasks: "tasks/acme.yaml"
      tags: "always"

    - name: "Run role certbot"
      ansible.builtin.include_role:
        name: "certbot"
      tags: "always"

    - name: "Run tasks haproxy.yml"
      ansible.builtin.include_tasks: "tasks/haproxy.yml"
      tags: "always"

    - name: "Run role openbao"
      ansible.builtin.include_role:
        name: "openbao"
      tags: "always"

    - name: "Run role vault_unsealer"
      ansible.builtin.include_role:
        name: "vault_unsealer"
      tags: "always"

    - name: "Run tasks vault_unsealer.yaml"
      ansible.builtin.include_tasks: "tasks/vault_unsealer.yaml"
      tags: "always"
