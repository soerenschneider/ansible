---
- name: "Install packages"
  ansible.builtin.package:
    name:
      - "jq"
      - "cryptsetup"
  tags: [media, storage]

- name: "Manage fileserver mode file"
  ansible.builtin.file:
    path: "{{ nas_fileserver_mode_active_file }}"
    state: "{{ 'touch' if fileserver_mode == 'active' else 'absent' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  tags: [media, storage]

# ownership and mode are managed in data-permissions.yaml
- name: Create mountpoint target path  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ nas_storage_disk_mountpoint }}"
    state: "directory"
  tags: [media, storage]
