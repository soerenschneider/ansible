---
- name: Rotate approle secret_ids
  hosts: all,!k8s
  strategy: free
  become: true
  tasks:
    - name: Including role
      ansible.builtin.include_role:
        name: vault_approle
      vars:
        vault_approle_force_rotate: true
      when: openbao_approle_clients | default([]) | length > 0
      tags: always
