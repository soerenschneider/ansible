---
- name: Install haproxy
  ansible.builtin.package:
    name: haproxy
  tags: haproxy

- name: Including role
  ansible.builtin.include_role:
    name: haproxy
  tags: always

- name: Add configuration block
  ansible.builtin.blockinfile:
    path: /etc/haproxy/haproxy.cfg
    block: |
      frontend metrics
        bind *:8405 ssl crt {{ haproxy_cert_file }} ca-file {{ pki_srn_ca_file }} verify required
        mode http
        no log

        http-request deny if !{ ssl_c_s_dn(cn) -f {{ haproxy_allowed_scrapers_cns_file }} }

        http-request use-service prometheus-exporter if { path /metrics/haproxy }
        use_backend metrics_node    if { path /metrics/node }
        use_backend metrics_openbao if { path /metrics/openbao }

        http-request deny deny_status 404

        backend metrics_node
        mode http
        http-request set-path /metrics
        server node_exporter 127.0.0.1:9100

        backend metrics_openbao
        mode http
        http-request set-path {{ openbao_metrics_path }}
        server openbao_metrics {{ openbao_metrics_listen_address }}

      # openbao has a http health endpoint on /v1/sys/health that returns different http codes
      # depending on the status of the running openbao instance.
      #
      # See: https://www.vaultproject.io/api/system/health.html#read-health-information
      #
      #    * 200 if initialized, unsealed, and active
      #    * 429 if unsealed and standby
      #    * 472 if data recovery mode replication secondary and active
      #    * 473 if performance standby
      #    * 501 if not initialized
      #    * 503 if sealed
      # Primary https listener
      frontend openbao_https
        mode tcp
        log global
        timeout client 30000
        bind *:443
        description openbao over https
        default_backend openbao_https
        option tcplog

      backend openbao_https
        mode tcp
        timeout check 5000
        timeout server 30000
        timeout connect 5000
        option httpchk GET /v1/sys/health
        http-check expect rstatus (200|429)
      {% for node in groups['openbao'] %}
        server {{ node.split('.')[0] }} {{ '127.0.0.1' if node == inventory_hostname else node }}:{{ hostvars[node].openbao_port | default(8200) }} check check-ssl verify required ca-file {{ system_ca_bundle }} verifyhost {{ node }} check-sni {{ node }} send-proxy inter 5000
      {% endfor %}
        #server openbao-1 127.0.0.1:8200 check check-ssl verify required ca-file @system-ca verifyhost bao-1.prd.dd.soeren.cloud check-sni bao-1.prd.dd.soeren.cloud send-proxy inter 5000

  notify: Restart haproxy
  tags: [haproxy]
