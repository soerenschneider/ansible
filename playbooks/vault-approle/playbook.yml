---
- name: Install vault-approle login information
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Including role
      ansible.builtin.include_role:
        name: baseline
      when: openbao_approle_clients | default([]) | length > 0
      tags: always

    - name: Including role
      ansible.builtin.include_role:
        name: vault_approle
      when: openbao_approle_clients | default([]) | length > 0
      tags: always
