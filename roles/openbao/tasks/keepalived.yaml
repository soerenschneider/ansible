---
# ============================================================================
# OpenBao — floating virtual IP for the cluster via keepalived (VRRP)
# ----------------------------------------------------------------------------
# Only useful with more than one node; main.yaml skips this file otherwise.
# The VIP is held by one node at a time and moves when that node's local
# HAProxy (which fronts the whole OpenBao cluster on :443) stops answering.
#
# Security posture:
#   * Unicast VRRP only. Adverts are sent to the cluster peers, never to the
#     multicast group, and check_unicast_src drops adverts from any source
#     that is not a configured peer.
#   * AH authentication (HMAC over the advert) by default, so a host on the
#     segment that does not know the key cannot inject adverts and steal the
#     VIP. VRRP auth is weak on its own; it is one layer, not the defence.
#   * The firewall must admit VRRP (IP protocol 112) from the peers only.
#     The baseline nftables firewall drops it otherwise, so add a rule to
#     baseline_firewall_rules (see openbao_keepalived_* in defaults).
#   * Health checks run as a dedicated unprivileged system user, with
#     enable_script_security so keepalived refuses scripts that a non-root
#     user could modify.
#   * The config holds the auth key: root-owned, 0600, never shown as a diff.
#   * keepalived runs with a systemd hardening drop-in.
#
# vrrp_strict is deliberately NOT set: it forbids both unicast and
# authentication, the two things this setup relies on.
# ============================================================================

- name: "[keepalived] Validate settings"
  ansible.builtin.assert:
    that:
      - openbao_keepalived_vip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
      - openbao_keepalived_virtual_router_id | int >= 1
      - openbao_keepalived_virtual_router_id | int <= 255
      - openbao_keepalived_auth_type in ['AH', 'PASS']
      # keepalived silently truncates longer keys to 8 characters.
      - openbao_keepalived_auth_pass | default('') | length == 8
      - openbao_keepalived_script_user | length > 0
      - openbao_keepalived_script_user != 'root'
      - groups[openbao_cluster_nodes_group] | difference(ansible_play_hosts_all) | length == 0
    fail_msg: >-
      openbao keepalived: set openbao_keepalived_vip as IPv4 CIDR (e.g. 10.0.0.10/24),
      openbao_keepalived_virtual_router_id to 1-255 (unique on the L2 segment),
      openbao_keepalived_auth_type to AH or PASS, openbao_keepalived_auth_pass to
      exactly 8 characters (keep it in vault/sops), a non-root
      openbao_keepalived_script_user, and run the play against all members of
      group "{{ openbao_cluster_nodes_group }}" so every node knows its peers.
    quiet: true
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Determine this node's VRRP address and interface"
  ansible.builtin.set_fact:
    _openbao_keepalived_src_ip: >-
      {{ openbao_keepalived_address
         or ansible_facts['default_ipv4']['address'] | default('') }}
    _openbao_keepalived_interface: >-
      {{ openbao_keepalived_interface
         or ansible_facts['default_ipv4']['interface'] | default('') }}
    # Highest priority for the first node of the group, so the initial
    # election is deterministic.
    _openbao_keepalived_priority: >-
      {{ openbao_keepalived_priority | int
         or 200 - 10 * groups[openbao_cluster_nodes_group].index(inventory_hostname) }}
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Collect peer addresses"
  ansible.builtin.set_fact:
    _openbao_keepalived_peers: >-
      {{ groups[openbao_cluster_nodes_group]
         | difference([inventory_hostname])
         | map('extract', hostvars, '_openbao_keepalived_src_ip')
         | list }}
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Validate derived addresses"
  ansible.builtin.assert:
    that:
      - _openbao_keepalived_src_ip | length > 0
      - _openbao_keepalived_interface | length > 0
      - _openbao_keepalived_peers | select | list | length == _openbao_keepalived_peers | length
      - _openbao_keepalived_peers | unique | length == _openbao_keepalived_peers | length
      - _openbao_keepalived_src_ip not in _openbao_keepalived_peers
      - (openbao_keepalived_vip | split('/') | first) != _openbao_keepalived_src_ip
      - (openbao_keepalived_vip | split('/') | first) not in _openbao_keepalived_peers
      - _openbao_keepalived_priority | int >= 1
      - _openbao_keepalived_priority | int <= 254
    fail_msg: >-
      openbao keepalived: could not derive a unique address/interface for
      {{ inventory_hostname }} (src={{ _openbao_keepalived_src_ip }},
      interface={{ _openbao_keepalived_interface }},
      peers={{ _openbao_keepalived_peers }}, priority={{ _openbao_keepalived_priority }}).
      Set openbao_keepalived_address / openbao_keepalived_interface per host;
      the VIP must not be a node address.
    quiet: true
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Install packages"
  ansible.builtin.package:
    name:
      - keepalived
      - curl
    state: present
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Create unprivileged health check user"
  ansible.builtin.user:
    name: "{{ openbao_keepalived_script_user }}"
    system: true
    shell: "/usr/sbin/nologin"
    create_home: false
    home: "/nonexistent"
    password: "!"
  tags: [openbao, openbao-keepalived]

# root-owned in a root-owned directory: enable_script_security refuses to run
# a script if it, or any directory above it, is writable by a non-root user.
- name: "[keepalived] Install health check script"
  ansible.builtin.template:
    src: "openbao-keepalived-check.sh.j2"
    dest: "{{ openbao_keepalived_check_script }}"
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Ensure config directory exists"
  ansible.builtin.file:
    path: "/etc/keepalived"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Template configuration"
  ansible.builtin.template:
    src: "openbao-keepalived.conf.j2"
    dest: "/etc/keepalived/keepalived.conf"
    owner: "root"
    group: "root"
    mode: "0600"
    validate: "keepalived --config-test --use-file=%s"
  # The file contains the VRRP auth key.
  diff: false
  notify: Restart keepalived
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Ensure systemd drop-in directory exists"
  ansible.builtin.file:
    path: "/etc/systemd/system/keepalived.service.d"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [openbao, openbao-keepalived]

# keepalived needs CAP_NET_ADMIN/CAP_NET_RAW to manage addresses and send
# adverts, and setuid/setgid to drop to the script user, so capabilities are
# left alone; this restricts filesystem and kernel access instead.
- name: "[keepalived] Install systemd hardening drop-in"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/keepalived.service.d/hardening.conf"
    owner: "root"
    group: "root"
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit.
      [Service]
      NoNewPrivileges=true
      ProtectSystem=full
      ProtectHome=true
      PrivateTmp=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      RestrictRealtime=true
      RestrictSUIDSGID=true
      LockPersonality=true
      RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET
  notify: Restart keepalived
  tags: [openbao, openbao-keepalived]

- name: "[keepalived] Enable and start keepalived"
  ansible.builtin.systemd_service:
    name: "keepalived"
    enabled: true
    state: started
    daemon_reload: true
  tags: [openbao, openbao-keepalived]
