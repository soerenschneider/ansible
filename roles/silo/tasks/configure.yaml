---
- name: Validate service account
  ansible.builtin.assert:
    that:
      - silo_user | length > 0
      - silo_user not in ["root", "toor", "nobody"]
      - silo_group | length > 0
      - silo_group not in ["root", "wheel", "sudo", "admin", "adm", "shadow", "disk", "kmem", "docker", "lxd", "nogroup"]
    fail_msg: "silo_user/silo_group must be a dedicated unprivileged service account"
    quiet: true
  tags: [silo, silo-install]

- name: Add silo group
  ansible.builtin.group:
    name: "{{ silo_group }}"
  tags: [silo, silo-install]

- name: Add silo user
  ansible.builtin.user:
    name: "{{ silo_user }}"
    group: "{{ silo_group }}"
    system: true
    shell: /usr/sbin/nologin
  tags: [silo, silo-install]

- name: Add base dir
  ansible.builtin.file:
    path: "{{ silo_base_dir }}"
    state: directory
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0700"
  tags: [silo, silo-install]

- name: Add volume dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0700"
  with_items: "{{ silo_volumes }}"
  tags: [silo, silo-install]

- name: Add silo config
  ansible.builtin.template:
    src: silo.conf.j2
    dest: /etc/silo.conf
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0600"
  notify: Restart silo
  tags: [silo, silo-install]

- name: Add silo systemd file
  ansible.builtin.template:
    src: silo.service.j2
    dest: /etc/systemd/system/silo.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart silo
  tags: [silo, silo-install]

- name: Enable/disable silo
  ansible.builtin.systemd:
    name: silo
    enabled: "{% if silo_disabled | default(False) %}false{% else %}true{% endif %}"
    state: "{% if silo_disabled | default(False) %}stopped{% else %}started{% endif %}"
    daemon_reload: true
  tags: [silo, silo-install]

- name: Start silo
  ansible.builtin.systemd:
    name: silo
    state: started
  tags: [silo, silo-install]
