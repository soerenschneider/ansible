---
- name: "Run tasks migrate.yml"
  ansible.builtin.include_tasks: migrate.yml
  when: silo_migrate_from_minio | bool
  tags: always

- name: "Run tasks install.yml"
  ansible.builtin.include_tasks: install.yml
  tags: always

- name: "Run tasks install-github.yml"
  ansible.builtin.include_tasks: install-github.yml
  vars:
    binary_name: "silo"
    github_repo: "pgsty/silo"
    service_name: "silo"
    version_wanted: "{{ silo_server_version }}"
  tags: always

- name: "Run tasks configure.yaml"
  ansible.builtin.include_tasks: configure.yaml
  tags: always
