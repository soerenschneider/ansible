---
- name: "Set variables"
  ansible.builtin.set_fact:
    silo_local_binary: ""
    silo_installed_version: ""
    silo_desired_version: "{{ version_wanted | default('') }}"
    silo_download_archive: ""
    silo_download_signature: ""
    silo_stopped_service: ""
    silo_github_release: ""
    silo_go_os: ""
    silo_go_arch: ""
    silo_checksum_signature_file: ""
    silo_checksum_file: ""
    silo_full_filename: ""
    silo_release_checksum: ""
  tags: [silo, silo-install, deps]

- name: Check for existing binary
  ansible.builtin.stat:
    path: /usr/local/bin/{{ binary_name }}
  register: silo_local_binary
  tags: [silo, silo-install, deps]

- name: Check installed version
  when: silo_local_binary.stat.exists
  tags: [silo, silo-install, deps]
  block:
    - name: Check installed version
      ansible.builtin.shell:
        cmd: "set -o pipefail && /usr/local/bin/{{ binary_name }} --version 2>&1 | head -n1 | awk '{print $3}'"
        executable: /bin/bash
      register: silo_installed_version
      changed_when: false

    - name: Register local version
      ansible.builtin.set_fact:
        silo_installed_version: "{{ silo_installed_version.stdout }}"
      changed_when: false

    - name: Print debug information
      ansible.builtin.debug:
        msg: "Installed version: {{ silo_installed_version }}"
      changed_when: false

- name: Fetch latest release information from github
  when: silo_desired_version is not defined or not silo_desired_version
  tags: [silo, silo-install, deps]
  block:
    - name: Print debug information
      ansible.builtin.uri:
        url: https://api.github.com/repos/{{ github_repo }}/releases/latest
        return_content: true
      register: silo_github_release
      retries: 3
      delay: 5
      until: silo_github_release is not failed

    - name: Set github release
      ansible.builtin.set_fact:
        silo_desired_version: "{{ silo_github_release.json.tag_name }}"
      changed_when: false

    - name: Print latest GitHub version
      ansible.builtin.debug:
        msg: "Latest GitHub version: {{ silo_desired_version }}"
      changed_when: false

- name: "Download artifacts"
  when: not silo_local_binary.stat.exists or silo_desired_version != silo_installed_version
  tags: [silo, silo-install, deps]
  block:
    - name: Generate temp dir
      become: false
      ansible.builtin.tempfile:
        state: directory
        suffix: "{{ binary_name }}"
      register: silo_download_dir

    - name: Set vars for generating download link
      ansible.builtin.set_fact:
        silo_go_os: "{{ ansible_system | lower }}"
        silo_go_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm' if ansible_architecture == 'armv7l' else 'arm64' if ansible_architecture == 'aarch64' }}"
        silo_download_dir: "{{ silo_download_dir.path }}"
        silo_extraction_dir: "{{ silo_download_dir.path }}/{{ binary_name }}"
      changed_when: false

    - name: Set filenames
      ansible.builtin.set_fact:
        silo_full_filename: >-
          {{
            binary_name + '_' +
            (
              silo_desired_version
              | regex_replace('^RELEASE\.', '')
              | regex_replace('[-T:Z]', '')
            )
            + '.0.0_' + silo_go_os + '_' + silo_go_arch + '.tar.gz'
          }}
        silo_url: ""
      changed_when: false

    - name: Query GitHub API for release metadata
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_repo }}/releases/tags/{{ silo_desired_version }}"
        return_content: true
      register: silo_release_data

    - name: Extract asset info for this architecture
      ansible.builtin.set_fact:
        silo_selected_asset: >-
          {{
            (silo_release_data.json.assets
            | selectattr('name','equalto', silo_full_filename)
            | list)[0]
          }}

    - name: Ensure asset was found
      ansible.builtin.fail:
        msg: "Asset {{ silo_full_filename }} not found in release"
      when: silo_selected_asset is not defined

    - name: "Print URL and digest"
      ansible.builtin.debug:
        msg: "Downloading {{ silo_selected_asset.browser_download_url }} with {{ silo_selected_asset.digest | trim | to_json }}"

    - name: Download silo with verified checksum
      become: false
      ansible.builtin.get_url:
        url: "{{ silo_selected_asset.browser_download_url }}"
        dest: "{{ silo_download_dir }}/{{ silo_full_filename }}"
        mode: "0644"
        checksum: "{{ silo_selected_asset.digest | trim }}"
      register: silo_download_archive
      until: silo_download_archive is succeeded
      retries: 5
      delay: 2

    - name: Stop service
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: stopped
      failed_when: false
      notify: "Restart silo"
      register: silo_stopped_service

    - name: Unpack binaries from archive
      become: false
      ansible.builtin.unarchive:
        src: "{{ silo_download_dir }}/{{ silo_full_filename }}"
        dest: "{{ silo_download_dir }}"
        creates: "{{ silo_download_dir }}/{{ binary_name }}"
        remote_src: true
      check_mode: false

    - name: Copy binaries
      ansible.builtin.copy:
        src: "{{ silo_download_dir }}/{{ item }}"
        dest: /usr/local/bin/{{ item }}
        remote_src: true
        mode: "0755"
        owner: root
        group: root
      with_items: ["{{ binary_name }}"]
