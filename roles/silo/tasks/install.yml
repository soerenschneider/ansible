---
- name: Validate service account
  ansible.builtin.assert:
    that:
      - silo_user | length > 0
      - silo_user not in ["root", "toor", "nobody"]
      - silo_group | length > 0
      - silo_group not in ["root", "wheel", "sudo", "admin", "adm", "shadow", "disk", "kmem", "docker", "lxd", "nogroup"]
    fail_msg: "silo_user/silo_group must be a dedicated unprivileged service account"
    quiet: true
  tags: [silo, silo-install]

- name: Add silo group
  ansible.builtin.group:
    name: "{{ silo_group }}"
  tags: [silo, silo-install]

- name: Add silo user
  ansible.builtin.user:
    name: "{{ silo_user }}"
    group: "{{ silo_group }}"
    shell: "/usr/sbin/nologin"
  tags: [silo, silo-install]

- name: Add silo certs dir
  ansible.builtin.file:
    path: "/home/{{ silo_user }}/.silo/certs"
    state: "directory"
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0750"
  tags: [silo, silo-install]

- name: Add base dir
  ansible.builtin.file:
    path: "{{ silo_base_dir }}"
    state: "directory"
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0700"
  tags: [silo, silo-install]

- name: Add volume dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ silo_user }}"
    group: "{{ silo_group }}"
    mode: "0700"
  with_items: "{{ silo_volumes }}"
  tags: [silo, silo-install]
