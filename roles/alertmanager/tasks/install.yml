---
- name: Validate service account
  ansible.builtin.assert:
    that:
      - alertmanager_user | length > 0
      - alertmanager_user not in ["root", "toor", "nobody"]
      - alertmanager_group | length > 0
      - alertmanager_group not in ["root", "wheel", "sudo", "admin", "adm", "shadow", "disk", "kmem", "docker", "lxd", "nogroup"]
    fail_msg: "alertmanager_user/alertmanager_group must be a dedicated unprivileged service account"
    quiet: true
  tags: [monitoring, alertmanager, alertmanager-install]

- name: Create alertmanager system group
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true
    state: present
  tags: [monitoring, alertmanager, alertmanager-install]

- name: Create alertmanager system user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: "/sbin/nologin"
    group: "{{ alertmanager_group }}"
    createhome: false
  tags: [monitoring, alertmanager, alertmanager-install]

- name: Create alertmanager data directory
  ansible.builtin.file:
    path: "{{ alertmanager_db_dir }}"
    state: "directory"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"
  tags: [monitoring, alertmanager, alertmanager-install]

- name: Create alertmanager configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: "directory"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0770"
  with_items:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_config_dir }}/templates"
    - "{{ alertmanager_db_dir }}"
  tags: [monitoring, alertmanager, alertmanager-install]

- name: Include tasks
  ansible.builtin.include_tasks: install-github.yml
  tags: [monitoring, alertmanager, alertmanager-install]
