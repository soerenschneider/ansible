---
# roles/wireguard/tasks/wireguard_secrets_check.yaml
#
# Checks every mesh in `wireguard_networks` against the three secret tables
# and reports what is missing or orphaned. Self-contained: it does not need
# `wireguard_mesh_name` or any per-membership fact, so it can be included
# once from main.yaml, before or after the per-mesh loop.
#
#   wg_pubkeys       <mesh> -> <inventory_host> -> public key
#   wg_privatekeys  <mesh> -> <inventory_host> -> private key   (sops)
#   wg_psks          <mesh> -> <host_a>_<host_b> -> psk          (sops)
#
# The mesh key must be identical across all four.
#
# `managed: false` on a member means its config is written by hand on the
# device -- a phone, a tablet. Such a member still needs a public key (its
# peers reference it) and pre-shared keys (both ends must match), but its
# private key never leaves the device, so it is exempt from the private-key
# check and its config is never rendered.

- name: Work out which secrets every mesh needs
  ansible.builtin.set_fact:
    _wireguard_secret_report_json: >-
      {%- set report = [] -%}
      {%- for mesh_name, mesh in (wireguard_networks | default({})).items() -%}
      {%- set members = {} -%}
      {%- for pname, pool in (mesh.pools | default({})).items() -%}
      {%- for mname, member in (pool.hosts | default({})).items() -%}
      {{- members.update({mname: member}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {%- set hosts = [] -%}
      {%- set managed_hosts = [] -%}
      {%- set psks = [] -%}
      {%- set no_host = [] -%}
      {%- for mname, m in members.items() -%}
      {%- set host = m.inventory_host | default('') -%}
      {%- if host | length == 0 -%}
      {{- no_host.append(mname) or '' -}}
      {%- else -%}
      {{- hosts.append(host) or '' -}}
      {%- if m.managed | default(true) -%}
      {{- managed_hosts.append(host) or '' -}}
      {%- endif -%}
      {%- set peers = (members.keys() | list) if (m.peers_with | default([])) == 'all'
                      else (m.peers_with | default([])) -%}
      {%- for pname2 in peers -%}
      {%- if pname2 != mname and pname2 in members -%}
      {%- set phost = members[pname2].inventory_host | default('') -%}
      {%- if phost | length > 0 and pname2 not in (m.no_psk_with | default([])) -%}
      {{- psks.append([host, phost] | sort | join('_')) or '' -}}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set want_hosts = hosts | unique | sort -%}
      {%- set want_privs = managed_hosts | unique | sort -%}
      {%- set want_psks = psks | unique | sort -%}
      {%- set have_pub = (wg_pubkeys | default({})).get(mesh_name, {}).keys() | list -%}
      {%- set have_priv = (wg_privatekeys | default({})).get(mesh_name, {}).keys() | list -%}
      {%- set have_psk = (wg_psks | default({})).get(mesh_name, {}).keys() | list -%}
      {{- report.append({
            'mesh': mesh_name,
            'no_inventory_host': no_host | sort,
            'missing_pubkeys': want_hosts | difference(have_pub),
            'missing_privkeys': want_privs | difference(have_priv),
            'missing_psks': want_psks | difference(have_psk),
            'orphan_pubkeys': have_pub | difference(want_hosts),
            'orphan_privkeys': have_priv | difference(want_privs),
            'orphan_psks': have_psk | difference(want_psks),
          }) or '' -}}
      {%- endfor -%}
      {{ report | to_json }}

- name: Decode the report
  ansible.builtin.set_fact:
    wireguard_secret_report: "{{ _wireguard_secret_report_json | from_json }}"

- name: Every member has an inventory_host
  ansible.builtin.assert:
    that:
      - wireguard_secret_report | map(attribute='no_inventory_host') | flatten | length == 0
    fail_msg: |
      Members without `inventory_host`, so no secret can be looked up:
      {% for m in wireguard_secret_report %}
      {% for h in m.no_inventory_host %}
        {{ m.mesh }}: {{ h }}
      {% endfor %}
      {% endfor %}
    quiet: true

- name: Every member has a public key
  ansible.builtin.assert:
    that:
      - wireguard_secret_report | map(attribute='missing_pubkeys') | flatten | length == 0
    fail_msg: |
      Missing public keys:
      {% for m in wireguard_secret_report %}
      {% for h in m.missing_pubkeys %}
        wg_pubkeys.{{ m.mesh }}.{{ h }}
      {% endfor %}
      {% endfor %}

      Derive one from its private key with:
        echo '<private key>' | wg pubkey
    quiet: true

- name: Every member has a private key
  ansible.builtin.assert:
    that:
      - wireguard_secret_report | map(attribute='missing_privkeys') | flatten | length == 0
    fail_msg: |
      Missing private keys:
      {% for m in wireguard_secret_report %}
      {% for h in m.missing_privkeys %}
        wg_privatekeys.{{ m.mesh }}.{{ h }}
      {% endfor %}
      {% endfor %}

      Generate with:
        wg genkey | tee /dev/stderr | wg pubkey
      First line is the private key (encrypt it), second is the public key.

      A member configured by hand on the device belongs in `managed: false`.
    quiet: true

- name: Every peering has a pre-shared key
  ansible.builtin.assert:
    that:
      - wireguard_secret_report | map(attribute='missing_psks') | flatten | length == 0
    fail_msg: |
      Missing pre-shared keys:
      {% for m in wireguard_secret_report %}
      {% for k in m.missing_psks %}
        wg_psks.{{ m.mesh }}.{{ k }}
      {% endfor %}
      {% endfor %}

      Generate with: wg genpsk
      A link that is deliberately without one belongs in `no_psk_with`.
    quiet: true
  when: wireguard_require_psk | default(true) | bool

- name: Report orphaned secrets
  ansible.builtin.debug:
    msg: |
      Secrets defined for members or peerings that no longer exist:
      {% for m in wireguard_secret_report %}
      {% for h in m.orphan_pubkeys %}
        wg_pubkeys.{{ m.mesh }}.{{ h }}
      {% endfor %}
      {% for h in m.orphan_privkeys %}
        wg_privatekeys.{{ m.mesh }}.{{ h }}
      {% endfor %}
      {% for k in m.orphan_psks %}
        wg_psks.{{ m.mesh }}.{{ k }}
      {% endfor %}
      {% endfor %}
  when: >-
    (wireguard_secret_report | map(attribute='orphan_pubkeys') | flatten | length
     + wireguard_secret_report | map(attribute='orphan_privkeys') | flatten | length
     + wireguard_secret_report | map(attribute='orphan_psks') | flatten | length) > 0
