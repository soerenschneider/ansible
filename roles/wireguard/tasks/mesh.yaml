---
# roles/wireguard/tasks/mesh.yaml
#
# Configures ONE mesh membership. Included per membership from main.yaml,
# which passes: wireguard_mesh_name, wireguard_mesh, wireguard_member,
# wireguard_pool, wireguard_device.
#
# The config is rendered into <wireguard_dir>/.staging/<device>.conf,
# validated with `wg-quick strip`, and only then moved up into place --
# with the previous config kept as <device>.conf.bak. Nothing is ever
# written directly over a working tunnel.
#
# The staging directory exists because wg-quick refuses any filename that
# is not <interface>.conf, so the staged copy cannot simply be suffixed.
# It sits on the same filesystem as the target, which keeps the final mv
# atomic.
#
# See defaults/main.yaml for the tunables.

# ---------------------------------------------------------------------------
# Confirm run: disarm a pending rollback for THIS mesh and skip the rest.
# ---------------------------------------------------------------------------

- name: Disarm any pending rollback
  when: wireguard_confirm | bool
  block:
    - name: Stop the rollback timer  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "systemctl stop wg-rollback-{{ wireguard_device }}.timer"
      register: _wireguard_disarm
      changed_when: _wireguard_disarm.rc == 0
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Rollback disarmed for {{ wireguard_device }} on {{ inventory_hostname }}.
          The running config stands.

# ---------------------------------------------------------------------------
# Members of THIS mesh only -- member names are unique per mesh, not
# globally, so flattening across meshes would collide.
# ---------------------------------------------------------------------------

# Everything below is skipped on a confirm run: it must not re-render.
- name: Configure this mesh
  when: not (wireguard_confirm | bool)
  block:
    - name: Flatten this mesh's members
      ansible.builtin.set_fact:
        _wireguard_members_json: >-
          {%- set out = {} -%}
          {%- for pname, pool in (wireguard_mesh.pools | default({})).items() -%}
          {%- for mname, member in (pool.hosts | default({})).items() -%}
          {{- out.update({mname: (member | combine({'_pool': pname}))}) or '' -}}
          {%- endfor -%}
          {%- endfor -%}
          {{ out | to_json }}

    - name: Decode this mesh's members
      ansible.builtin.set_fact:
        wireguard_members: "{{ _wireguard_members_json | from_json }}"

    # ---------------------------------------------------------------------------
    # Consistency checks -- cheap, and they catch the failure modes that produce
    # a tunnel which comes up but carries nothing
    # ---------------------------------------------------------------------------

    # `loop` is resolved before `when`, so a `peers_with: all` string cannot be
    # handed to loop even behind a condition. Expand it once, here.
    - name: Expand this host's peer list
      ansible.builtin.set_fact:
        wireguard_peers: >-
          {{ (wireguard_members.keys() | list | reject('equalto', wireguard_member) | sort)
            if (wireguard_members[wireguard_member].peers_with | default([])) == 'all'
            else (wireguard_members[wireguard_member].peers_with | default([]) | sort) }}

    - name: Every peer this host names exists
      ansible.builtin.assert:
        that:
          - wireguard_peer in wireguard_members
        fail_msg: "{{ wireguard_member }} peers with unknown member '{{ wireguard_peer }}'"
        quiet: true
      loop: "{{ wireguard_peers }}"
      loop_control:
        loop_var: wireguard_peer

    - name: Peering is declared in both directions
      ansible.builtin.assert:
        that:
          - (wireguard_members[wireguard_peer].peers_with | default([])) == 'all'
            or wireguard_member in (wireguard_members[wireguard_peer].peers_with | default([]))
        fail_msg: >-
          {{ wireguard_member }} peers with {{ wireguard_peer }}, but {{ wireguard_peer }} does not peer
          back. A one-sided link produces a tunnel that never handshakes.
        quiet: true
      loop: "{{ wireguard_peers }}"
      loop_control:
        loop_var: wireguard_peer

    # Public keys live centrally in wg_pubkeys, keyed by mesh then by inventory
    # hostname -- the same shape as wg_psks and wg_private_keys, so a key
    # rotation touches one row per table rather than a mix of inline fields.
    - name: Every member has a public key
      ansible.builtin.assert:
        that:
          - (wg_pubkeys | default({})).get(wireguard_mesh_name, {}).get(wireguard_members[wireguard_peer].inventory_host | default(''), '') | length > 0
        fail_msg: >-
          Missing wg_pubkeys.{{ wireguard_mesh_name }}.{{ wireguard_members[wireguard_peer].inventory_host | default('<no inventory_host>') }}
          (member '{{ wireguard_peer }}'). Defined keys for this mesh:
          {{ (wg_pubkeys | default({})).get(wireguard_mesh_name, {}).keys() | list | sort | join(', ') | default('none', true) }}
        quiet: true
      loop: "{{ ([wireguard_member] + wireguard_peers) | unique }}"
      loop_control:
        loop_var: wireguard_peer

    - name: Member address falls inside its pool
      ansible.builtin.assert:
        that:
          - wireguard_members[wireguard_member].logical | ansible.utils.ipaddr(wireguard_mesh.pools[wireguard_pool].cidr) is truthy
          - wireguard_members[wireguard_member].logical | ansible.utils.ipaddr(wireguard_mesh.net) is truthy
        fail_msg: >-
          {{ wireguard_member }} ({{ wireguard_members[wireguard_member].logical }}) is outside pool
          {{ wireguard_pool }}
          ({{ wireguard_mesh.pools[wireguard_pool].cidr }}) or outside the
          mesh net {{ wireguard_mesh.net }}.
        quiet: true

    - name: Ensure the config directory exists
      ansible.builtin.file:
        path: "{{ wireguard_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # wg-quick strip requires the file to be named <interface>.conf, so the
    # staging copy cannot be wg0.conf.new. Stage it under the real name in a
    # private subdirectory instead, then move it up one level.
    - name: Create the staging directory
      ansible.builtin.file:
        path: "{{ wireguard_dir }}/.staging"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0700"

    - name: Render the config to the staging directory
      ansible.builtin.template:
        src: wg.conf.j2
        dest: "{{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf"
        owner: "root"
        group: "root"
        mode: "0600"
      register: _wireguard_staged

    - name: Validate the staged config
      ansible.builtin.command:
        cmd: "wg-quick strip {{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf"
      changed_when: false
      check_mode: false
      register: _wireguard_strip
      failed_when: false

    - name: Remove the staged config if it does not parse
      ansible.builtin.file:
        path: "{{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf"
        state: absent
      when: _wireguard_strip.rc != 0

    - name: Fail on an invalid config
      ansible.builtin.fail:
        msg: |
          Staged config for {{ wireguard_device }} does not parse; it has been removed
          and the running config is untouched.

          {{ _wireguard_strip.stderr | default(_wireguard_strip.stdout) }}
      when: _wireguard_strip.rc != 0

    - name: Read the current config
      ansible.builtin.slurp:
        src: "{{ wireguard_dir }}/{{ wireguard_device }}.conf"
      register: _wireguard_current
      failed_when: false

    - name: Read the staged config
      ansible.builtin.slurp:
        src: "{{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf"
      register: _wireguard_new

    - name: Decide whether anything changed
      ansible.builtin.set_fact:
        _wireguard_changed: >-
          {{ (_wireguard_current.content | default('')) != (_wireguard_new.content | default('')) }}

    - name: Discard the staged config when it matches the running one
      ansible.builtin.file:
        path: "{{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf"
        state: absent
      when: not (_wireguard_changed | bool)

    - name: Back up the current config
      ansible.builtin.copy:
        src: "{{ wireguard_dir }}/{{ wireguard_device }}.conf"
        dest: "{{ wireguard_dir }}/{{ wireguard_device }}.conf.bak"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - _wireguard_changed | bool
        - _wireguard_current.content is defined

    - name: Move the staged config into place
      ansible.builtin.command:
        cmd: "mv -f {{ wireguard_dir }}/.staging/{{ wireguard_device }}.conf {{ wireguard_dir }}/{{ wireguard_device }}.conf"
      when: _wireguard_changed | bool
      register: _wireguard_moved
      changed_when: _wireguard_moved.rc == 0

    - name: Add systemd override directory
      ansible.builtin.file:
        name: /etc/systemd/system/wg-quick@{{ wireguard_device }}.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add systemd override config
      ansible.builtin.template:
        src: wg-quick.override.conf.j2
        dest: /etc/systemd/system/wg-quick@{{ wireguard_device }}.service.d/override.conf
        owner: root
        group: root
        mode: "0640"

    - name: Enable the tunnel
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_device }}"
        enabled: true
        state: started

    # A config can parse and still be wrong -- a stale peer key or the wrong
    # AllowedIPs locks you out of a remote router, with the backup sitting on a
    # machine you can no longer reach. Arm the restore BEFORE the restart.
    - name: Arm the rollback
      ansible.builtin.command:
        cmd: >-
          systemd-run
          --on-active={{ wireguard_rollback_seconds }}
          --unit=wg-rollback-{{ wireguard_device }}
          --description="Restore {{ wireguard_device }}.conf.bak if not disarmed"
          /bin/sh -c
          'mv -f {{ wireguard_dir }}/{{ wireguard_device }}.conf.bak {{ wireguard_dir }}/{{ wireguard_device }}.conf
          && systemctl restart wg-quick@{{ wireguard_device }}'
      when:
        - _wireguard_changed | bool
        - wireguard_restart | bool
        - (wireguard_rollback_seconds | int) > 0
        - _wireguard_current.content is defined
      changed_when: true

    - name: Reload the tunnel
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_device }}"
        daemon_reload: true
        state: "restarted"
      when:
        - _wireguard_changed | bool
        - wireguard_restart | bool

    # ---------------------------------------------------------------------------
    # Verify
    #
    # Only peers this host dials can be tested: a peer with no Endpoint has an
    # address we do not know until it sends us something, so there is nothing to
    # ping. On the hub that leaves little or nothing to check, which is correct
    # -- rs genuinely cannot reach ez until ez dials in.
    # ---------------------------------------------------------------------------
    # A peer is dialed when it has an Endpoint and we are not set to no_dial
    # toward it -- the same condition the template uses to emit Endpoint.
    - name: Work out which peers this host dials
      ansible.builtin.set_fact:
        wireguard_verify_targets: >-
          {{ wireguard_peers
            | reject('in', wireguard_members[wireguard_member].no_dial | default([]))
            | map('extract', wireguard_members)
            | selectattr('endpoint', 'defined')
            | map(attribute='logical')
            | list }}

    - name: Verify the tunnel
      when:
        - wireguard_verify | bool
        - _wireguard_changed | bool
        - wireguard_restart | bool
      block:
        - name: Wait for the interface to come up
          ansible.builtin.command:
            cmd: "wg show {{ wireguard_device }}"
          changed_when: false
          register: _wireguard_show
          until: _wireguard_show.rc == 0
          retries: 3
          delay: 2

        # One reachable peer is enough: a peer can be legitimately down without
        # the tunnel being broken. Retry the whole set until something answers,
        # rather than each target in turn -- otherwise a single dead peer costs
        # retries * delay before the live ones are even tried.
        - name: Ping the dialed peers until one answers
          ansible.builtin.shell:
            cmd: |
              for ip in {{ wireguard_verify_targets | join(' ') }}; do
                if ping -c 2 -W 2 -I {{ wireguard_device }} "$ip" >/dev/null 2>&1; then
                  echo "$ip"
                  exit 0
                fi
              done
              exit 1
          args:
            executable: /bin/sh
          changed_when: false
          register: _wireguard_ping
          until: _wireguard_ping.rc == 0
          retries: "{{ wireguard_verify_retries }}"
          delay: "{{ wireguard_verify_delay }}"
          when: wireguard_verify_targets | length > 0

        - name: Note which peer answered
          ansible.builtin.debug:
            msg: >-
              Tunnel up: {{ _wireguard_ping.stdout | trim }} answered over
              {{ wireguard_device }}
              ({{ wireguard_verify_targets | length }} target{{ '' if wireguard_verify_targets | length == 1 else 's' }} tried).
          when: wireguard_verify_targets | length > 0

        - name: Confirm at least one handshake
          ansible.builtin.shell:
            cmd: "set -o pipefail && wg show {{ wireguard_device }} latest-handshakes | awk '$2 != 0' | wc -l"
            executable: /bin/bash
          changed_when: false
          register: _wireguard_handshakes
          until: (_wireguard_handshakes.stdout | int) > 0
          retries: "{{ wireguard_verify_retries }}"
          delay: "{{ wireguard_verify_delay }}"
          when: wireguard_verify_targets | length == 0

        - name: Disarm the rollback -- the tunnel works  # noqa: command-instead-of-module
          ansible.builtin.command:
            cmd: "systemctl stop wg-rollback-{{ wireguard_device }}.timer"
          changed_when: true
          failed_when: false
          when: (wireguard_rollback_seconds | int) > 0

      rescue:
        - name: Restore the previous config
          ansible.builtin.command:
            cmd: "mv -f {{ wireguard_dir }}/{{ wireguard_device }}.conf.bak {{ wireguard_dir }}/{{ wireguard_device }}.conf"
          when:
            - (wireguard_rollback_seconds | int) == 0
            - _wireguard_current.content is defined
          changed_when: true

        - name: Restart on the restored config
          ansible.builtin.systemd_service:
            name: "wg-quick@{{ wireguard_device }}"
            state: restarted
          when:
            - (wireguard_rollback_seconds | int) == 0
            - _wireguard_current.content is defined

        - name: Fail
          ansible.builtin.fail:
            msg: "{{ _wireguard_fail_lines | reject('equalto', '') | list }}"
          vars:
            _wireguard_armed: "{{ (wireguard_rollback_seconds | int) > 0 }}"
            _wireguard_fail_lines:
              - "Tunnel verification failed on {{ inventory_hostname }}."
              - "{{ 'No peer answered. Tried: ' ~ wireguard_verify_targets | join(', ') if wireguard_verify_targets | length > 0 else 'This host dials no peers; no inbound handshake arrived.' }}"
              - "{{ 'A rollback is armed: the previous config is restored within ' ~ wireguard_rollback_seconds ~ 's. Do NOT run with wireguard_confirm=true.' if _wireguard_armed | bool else '' }}"
              - "{{ 'Previous config restored from .bak and the tunnel restarted.' if (not (_wireguard_armed | bool) and _wireguard_current.content is defined) else '' }}"
              - "{{ 'No previous config existed; the tunnel is down.' if (not (_wireguard_armed | bool) and _wireguard_current.content is not defined) else '' }}"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ _wireguard_report | reject('equalto', '') | list }}"
      vars:
        _wireguard_armed: >-
          {{ _wireguard_changed | bool and wireguard_restart | bool
            and (wireguard_rollback_seconds | int) > 0
            and _wireguard_current.content is defined }}
        _wireguard_report:
          - "{{ inventory_hostname }} is member '{{ wireguard_member }}' on mesh '{{ wireguard_mesh_name }}'."
          - "{{ 'Config updated; previous kept at ' ~ wireguard_dir ~ '/' ~ wireguard_device ~ '.conf.bak' if _wireguard_changed | bool else 'Config unchanged.' }}"
          - "{{ 'ROLLBACK ARMED: previous config restored in ' ~ wireguard_rollback_seconds ~ 's unless disarmed.' if _wireguard_armed | bool else '' }}"
          - "{{ 'Disarm with: ansible-playbook ... -e wireguard_confirm=true' if _wireguard_armed | bool else '' }}"
          - "{{ 'or on the host: systemctl stop wg-rollback-' ~ wireguard_device ~ '.timer' if _wireguard_armed | bool else '' }}"
