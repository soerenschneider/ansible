---
- name: "Run tasks system_basics.yaml"
  ansible.builtin.include_tasks: system_basics.yml
  tags: always

- name: "Run tasks linux-sysctl.yml"
  ansible.builtin.include_tasks: linux-sysctl.yml
  tags: always

- name: "Run tasks net-validate-data.yaml"
  ansible.builtin.include_tasks: "net-validate-data.yaml"
  run_once: true
  tags: always

- name: "Run tasks net-firewall-data.yml"
  ansible.builtin.include_tasks: net-firewall-data.yml
  tags: always

- name: "Run tasks packages.yml"
  ansible.builtin.include_tasks: packages.yml
  when: ansible_system == "Linux"
  tags: always

- name: "Configure NFT based firewall"
  ansible.builtin.include_tasks: "net-firewall-nft.yaml"
  when:
    - baseline_firewall_enabled
    - baseline_firewall_nft_enabled
    - not inventory_hostname.startswith("k8s-")
  ignore_errors: true  # noqa: ignore-errors
  tags: always

- name: "Configure distro-based firewall"
  ansible.builtin.include_tasks: "firewall_rules_{{ ansible_os_family | lower }}.yml"
  when:
    - baseline_firewall_enabled
    - not baseline_firewall_nft_enabled
    - not inventory_hostname.startswith("k8s-")
  ignore_errors: true  # noqa: ignore-errors
  tags: always

- name: Read the device tree model
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: _baseline_dt_model
  failed_when: false
  changed_when: false
  tags: always

- name: Detect Raspberry Pi hardware
  ansible.builtin.set_fact:
    _baseline_is_raspberry_pi: >-
      {{ (_baseline_dt_model.content | default('') | b64decode) is search('Raspberry Pi') }}
  tags: always

- name: "Run tasks journald.yaml"
  ansible.builtin.include_tasks: journald.yaml
  when:
    - ansible_system == "Linux"
    - not _baseline_is_raspberry_pi
  tags: always

- name: "Include role raspberry"
  ansible.builtin.include_role:
    name: raspberry
  when: _baseline_is_raspberry_pi | bool
  tags: always

- name: "Run tasks default_users.yml"
  ansible.builtin.include_tasks: default_users.yml
  when:
    - baseline_default_users_name is defined
    - baseline_default_users_name | length > 0
    - ansible_user != baseline_default_users_name
  tags: always

- name: "Run tasks ssh-authorized-keys.yml"
  ansible.builtin.include_tasks: ssh-authorized-keys.yml
  tags: always

- name: "Run tasks mounts.yml"
  ansible.builtin.include_tasks: mounts.yml
  when: ansible_system == "Linux"
  tags: always

- name: "Run tasks signify.yaml"
  ansible.builtin.include_tasks: crypto-signify.yml
  tags: always

- name: "Ensure public key directory exists"
  ansible.builtin.file:
    path: "{{ baseline_crypto_pubkey_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [bootstrap, base, crypto, age, gpg]

- name: "Ensure private key directory exists"
  ansible.builtin.file:
    path: "{{ baseline_crypto_private_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [bootstrap, base, crypto, age, gpg]

- name: "Run tasks crypto-pki.yml"
  ansible.builtin.include_tasks: crypto-pki.yml
  tags: always

- name: Ensure public key directory exists
  ansible.builtin.file:
    path: "{{ baseline_crypto_pubkey_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [bootstrap, base, crypto, age, gpg]

- name: Ensure local facts directory exists
  ansible.builtin.file:
    path: "{{ baseline_facts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [bootstrap, base, crypto, age, gpg]

# Exposes every file in baseline_pubkey_dir as
# ansible_local.baseline_pubkeys.<filename>
- name: Install baseline_pubkeys local fact
  ansible.builtin.copy:
    dest: "{{ baseline_facts_dir }}/baseline_pubkeys.fact"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by Ansible
      dir={{ baseline_crypto_pubkey_dir }}
      sep=
      printf '{'
      for f in "$dir"/*; do
        [ -f "$f" ] || continue
        printf '%s"%s":"%s"' "$sep" "${f##*/}" "$(tr -d '\n' < "$f")"
        sep=,
      done
      printf '}\n'
  tags: [bootstrap, base, crypto, age, gpg]

- name: "Run tasks crypto-age.yml"
  ansible.builtin.include_tasks: "crypto-age.yaml"
  tags: always

- name: "Run tasks crypto-gpg.yml"
  ansible.builtin.include_tasks: "crypto-gpg.yaml"
  tags: always

# Merges {"host_age_keys": {host: key}, "host_gpg_keys": {host: key}}
# for all hosts in the play into the existing file. Hosts not in the play
# keep their entries; hosts in the play get their entries updated.
- name: Harvest public keys to controller
  when: baseline_pubkey_harvest_file | default("") | length > 0
  delegate_to: localhost
  become: false
  run_once: true
  tags: always
  block:
    - name: Check for existing public key map
      ansible.builtin.stat:
        path: "{{ baseline_pubkey_harvest_file }}"
      register: baseline_pubkey_harvest_stat

    - name: Read existing public key map
      ansible.builtin.slurp:
        src: "{{ baseline_pubkey_harvest_file }}"
      register: baseline_pubkey_harvest_existing
      when: baseline_pubkey_harvest_stat.stat.exists

    - name: Write merged public key map
      ansible.builtin.copy:
        dest: "{{ baseline_pubkey_harvest_file }}"
        mode: "0644"
        content: |
          {%- set old = (baseline_pubkey_harvest_existing.content | b64decode | from_json)
                if baseline_pubkey_harvest_stat.stat.exists else {} -%}
          {%- set new = {'host_age_keys': {}, 'host_gpg_keys': {}} -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set k = (hostvars[h].ansible_local | default({})).baseline_pubkeys | default({}) -%}
          {%-   if k.age is defined %}{% set _ = new.host_age_keys.update({h: k.age}) %}{% endif -%}
          {%-   if k.gpg is defined %}{% set _ = new.host_gpg_keys.update({h: k.gpg}) %}{% endif -%}
          {%- endfor -%}
          {{ old | combine(new, recursive=True) | to_nice_json }}

- name: "Run tasks wake_on_lan.yaml"
  ansible.builtin.include_tasks: wake_on_lan.yaml
  when: baseline_wol_enable
  tags: always

- name: "Run tasks net-dns.yaml"
  ansible.builtin.include_tasks: net-dns.yaml
  tags: always
