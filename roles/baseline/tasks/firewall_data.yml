---
# roles/baseline/tasks/fw_facts.yaml
#
# Derives firewall facts from `networks` and `wireguard_networks` so a host
# can write rules in terms of tags and pools instead of addresses.
#
# Every fact this file sets starts with `baseline_`, so a rule or template
# in another role can tell where it came from, and nothing in inventory can
# collide with it by accident. Facts outrank inventory in precedence, so an
# unprefixed collision would be silent. Scratch facts start with
# `_baseline_`.
#
# Include it before rendering any per-host nft config:
#
#   - ansible.builtin.include_tasks: fw_facts.yaml
#
# run_once is set inside this file, so include_tasks and import_tasks both work.
#
# Produces, as dicts:
#
#   baseline_fw_tags_by_dc[<dc>][<tag>]     addresses with that tag, per datacenter
#   baseline_fw_tags_global[<tag>]          ...everywhere
#   baseline_fw_tags_local[<tag>]           ...in this host's datacenter
#   baseline_fw_pools[<dc>][<seg>][<pool>]  pool prefix
#   baseline_fw_nets[<dc>][<seg>]           segment prefix
#
# ...and, for readability in rule files, the same data as flat variables.
# `local` is this host's datacenter, `global` is every datacenter at once,
# and every datacenter also gets its own name:
#
#   baseline_fw_tags_local_<tag>            baseline_fw_tags_local_prometheus
#   baseline_fw_tags_<dc>_<tag>             baseline_fw_tags_dd_prometheus
#   baseline_fw_tags_global_<tag>           baseline_fw_tags_global_prometheus
#
#   baseline_fw_pools_local_<seg>_<pool>    baseline_fw_pools_local_servers_openbao
#   baseline_fw_pools_<dc>_<seg>_<pool>     baseline_fw_pools_dd_servers_vms
#   baseline_fw_pools_global_<seg>_<pool>   baseline_fw_pools_global_servers_vms
#
#   baseline_fw_nets_local_<seg>            baseline_fw_nets_local_users
#   baseline_fw_nets_<dc>_<seg>             baseline_fw_nets_dd_users
#   baseline_fw_nets_global_<seg>           baseline_fw_nets_global_users
#
# Types: a tag variable is always a list. A `local` or per-datacenter
# prefix variable is a single CIDR string, because one datacenter has one
# of each. A `global` prefix variable is a LIST of CIDRs -- every
# datacenter's version of that segment or pool -- so it drops straight into
# an nft set alongside the tag lists.
#
# `wg` is a datacenter here, mirroring how the router's nft defines treat
# the meshes: each mesh is a segment and its pools are that segment's pools.
#
#   baseline_fw_nets_wg_<mesh>              baseline_fw_nets_wg_soeren_cloud
#   baseline_fw_pools_wg_<mesh>_<pool>      baseline_fw_pools_wg_soeren_cloud_clients
#   baseline_fw_tags_wg_<tag>               every tunnel endpoint with that tag
#
# A mesh member carrying `site: dd` is counted twice on purpose: under `wg`
# (it is a tunnel endpoint) and under `dd` (it is that router's address). So
# baseline_fw_tags_dd_router holds dd's tunnel address next to its LAN ones,
# while baseline_fw_tags_wg_router holds every router's tunnel address.
#
# Clients with no `site` -- phones, laptops -- appear only under `wg`, which
# is what makes baseline_fw_pools_wg_<mesh>_clients and
# baseline_fw_tags_wg_humans useful for "anything arriving over the tunnel".
#
# This requires `wireguard_networks` to be in scope for every host, not
# just for the routers -- the fingerprint check below enforces it.
#
# Names are sanitised to [a-z0-9_].
#
# Which tags get a variable: every tag some host carries, every key and
# every value in `firewall_tag_groups`, and anything listed in
# `firewall_declared_tags`. A tag in that set but absent from this
# datacenter gets an empty list, so a rule referring to it renders as an
# empty set rather than failing.
#
# A tag NO host carries anywhere and that appears in none of those places
# gets no variable at all, and a rule referring to it fails with
# "'baseline_fw_tags_<x>' is undefined". That is nearly always a typo or a
# renamed tag -- the task below prints the names that do exist. To reference
# a tag deliberately before any host carries it, list it in
# `firewall_declared_tags`.
#
# Two halves. The SHARED half is identical for every host -- the closure,
# the tag/pool/segment maps, the network lists and every per-datacenter and
# global flat variable -- so it runs once (`run_once: true`) and Ansible hands
# the resulting facts to every host in the play (or in each `serial` batch).
# The PER-HOST half resolves this host's datacenter and publishes only the
# `local` views. With many hosts that is the difference between publishing
# every flat variable once per host and publishing it once.
#
# run_once builds the shared facts from the FIRST host's view of the input
# (networks, wireguard_networks, network_floating_devices,
# firewall_tag_groups, firewall_declared_tags, firewall_untrusted_segments).
# Every host fingerprints its own view and fails if it differs, so a host
# that sees other data never silently receives facts built from someone
# else's. Keep those variables in group_vars/all (or equivalent).
#
# Every task carries `tags: [firewall, base]`, so the facts can be rebuilt
# on their own (--tags firewall) or as part of a baseline run (--tags base).
# They must run before anything that reads firewall_rules, since group_vars
# referencing baseline_fw_* is resolved lazily at use time.
#
# ===========================================================================
# SHARED: computed once, handed to every host
# ===========================================================================

- name: Fingerprint the input data
  ansible.builtin.set_fact:
    _baseline_fw_input_fingerprint: "{{ _baseline_fw_my_fingerprint }}"
  vars:
    _baseline_fw_my_fingerprint: >-
      {{ [networks | default({}), wireguard_networks | default({}),
          network_floating_devices | default({}), firewall_tag_groups | default({}),
          firewall_declared_tags | default([]), firewall_untrusted_segments | default(['guest'])]
         | to_json(sort_keys=true) | hash('sha1') }}
  run_once: true
  tags: [firewall, base]

# Runs on every host: it is what makes run_once safe.
- name: Every host sees the same input data
  ansible.builtin.assert:
    that:
      - _baseline_fw_my_fingerprint == _baseline_fw_input_fingerprint
    fail_msg: >-
      {{ inventory_hostname }} sees different networks /
      wireguard_networks / network_floating_devices / firewall_* data than
      {{ ansible_play_hosts | first }}, which the shared firewall facts are
      built from. Those variables must be the same for every host -- move
      them to group_vars/all, or into a group every host belongs to.
    quiet: true
  vars:
    _baseline_fw_my_fingerprint: >-
      {{ [networks | default({}), wireguard_networks | default({}),
          network_floating_devices | default({}), firewall_tag_groups | default({}),
          firewall_declared_tags | default([]), firewall_untrusted_segments | default(['guest'])]
         | to_json(sort_keys=true) | hash('sha1') }}
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Tag closure: tag -> every tag it implies, transitively
# ---------------------------------------------------------------------------

- name: Warn when the mesh data is not in scope
  ansible.builtin.debug:
    msg: >-
      `wireguard_networks` is undefined or empty for
      {{ inventory_hostname }}, so no baseline_fw_*_wg_* variables will exist and mesh addresses are
      missing from every tag. If the meshes live in a group_vars file that
      only the routers load, move them somewhere this host sees too.
  when: (wireguard_networks | default({})) | length == 0
  run_once: true
  tags: [firewall, base]

- name: Expand tag composition
  ansible.builtin.set_fact:
    _baseline_fw_closure_json: >-
      {%- set closure = {} -%}
      {%- for tag, implied in (firewall_tag_groups | default({})).items() -%}
      {{- closure.update({tag: implied | flatten | unique | list}) or '' -}}
      {%- endfor -%}
      {%- for _pass in range(8) -%}
      {%- for tag in closure.keys() | list -%}
      {%- set acc = closure.get(tag, []) -%}
      {%- set expanded = [] -%}
      {{- expanded.extend(acc) or '' -}}
      {%- for t in acc -%}
      {{- expanded.extend(closure.get(t, [])) or '' -}}
      {%- endfor -%}
      {{- closure.update({tag: expanded | unique | list}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {{ closure | to_json }}
  run_once: true
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Every tagged address, from both the segments and the meshes
# ---------------------------------------------------------------------------

- name: Flatten tagged hosts
  ansible.builtin.set_fact:
    _baseline_fw_hosts_json: >-
      {%- set closure = _baseline_fw_closure_json | from_json -%}
      {%- set floating = {} -%}
      {%- for dname, fdev in (network_floating_devices | default({})).items() -%}
      {%- if fdev.fw_tags is defined and fdev.mac is defined -%}
      {{- floating.update({fdev.mac | lower: fdev.fw_tags | flatten | unique | list}) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- set sources = [] -%}
      {%- for site, net in (networks | default({})).items() -%}
      {%- for dev in net.devices | default([]) -%}
      {{- sources.append({
            'site': site,
            'seg': dev.name | default(dev.device) | default('unnamed'),
            'tags': dev.fw_tags | default([]) | flatten,
            'pools': dev.pools | default({}),
          }) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {%- for mesh_name, mesh in (wireguard_networks | default({})).items() -%}
      {{- sources.append({
            'site': 'wg',
            'seg': mesh_name,
            'tags': mesh.fw_tags | default([]) | flatten,
            'pools': mesh.pools | default({}),
          }) or '' -}}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for src in sources -%}
      {%- for pname, pool in src.pools.items() -%}
      {%- for hname, host in (pool.hosts | default({})).items() -%}
      {%- set own = [] -%}
      {{- own.extend(src.tags) or '' -}}
      {{- own.extend(pool.fw_tags | default([]) | flatten) or '' -}}
      {{- own.extend(host.fw_tags | default([]) | flatten) or '' -}}
      {{- own.extend(floating.get(host.physical | default('') | lower, [])) or '' -}}
      {%- if own | length > 0 -%}
      {%- set eff = [] -%}
      {{- eff.extend(own) or '' -}}
      {%- for t in own | unique -%}
      {{- eff.extend(closure.get(t, [])) or '' -}}
      {%- endfor -%}
      {#- A mesh member counts under `wg` AND under the site it belongs to,
          so a rule can say baseline_fw_tags_wg_router (every tunnel
          endpoint) or baseline_fw_tags_dd_router (dd's tunnel address,
          alongside its LAN ones). -#}
      {{- out.append({
            'site': src.site,
            'ip': host.logical | default(''),
            'tags': eff | unique | sort,
          }) or '' -}}
      {%- if host.site is defined and host.site != src.site -%}
      {{- out.append({
            'site': host.site,
            'ip': host.logical | default(''),
            'tags': eff | unique | sort,
          }) or '' -}}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}
  run_once: true
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Pools and segments
# ---------------------------------------------------------------------------

- name: Flatten pools and segments
  ansible.builtin.set_fact:
    _baseline_fw_prefixes_json: >-
      {%- set pools = {} -%}
      {%- set nets = {} -%}
      {%- for site, net in (networks | default({})).items() -%}
      {{- pools.update({site: pools.get(site, {})}) or '' -}}
      {{- nets.update({site: nets.get(site, {})}) or '' -}}
      {%- for dev in net.devices | default([]) -%}
      {%- set seg = dev.name | default(dev.device) | default('unnamed') -%}
      {%- if dev.address is defined -%}
      {{- nets[site].update({seg: dev.address | ansible.utils.ipaddr('subnet')}) or '' -}}
      {%- endif -%}
      {%- set p = {} -%}
      {%- for pname, pool in (dev.pools | default({})).items() -%}
      {%- if pool.cidr is defined -%}
      {{- p.update({pname: pool.cidr}) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- if p -%}
      {{- pools[site].update({seg: p}) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- for mesh_name, mesh in (wireguard_networks | default({})).items() -%}
      {{- nets.update({'wg': nets.get('wg', {})}) or '' -}}
      {{- pools.update({'wg': pools.get('wg', {})}) or '' -}}
      {%- if mesh.net is defined -%}
      {{- nets['wg'].update({mesh_name: mesh.net}) or '' -}}
      {%- endif -%}
      {%- set p = {} -%}
      {%- for pname, pool in (mesh.pools | default({})).items() -%}
      {%- if pool.cidr is defined -%}
      {{- p.update({pname: pool.cidr}) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {{- pools['wg'].update({mesh_name: p}) or '' -}}
      {%- endfor -%}
      {{ {'pools': pools, 'nets': nets} | to_json }}
  run_once: true
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Assemble the dicts
# ---------------------------------------------------------------------------

# Built as JSON and decoded next. A Jinja expression ending in `{{ out }}`
# renders the dict as its string repr, which then has no .keys().
- name: Build the tag map, per datacenter
  ansible.builtin.set_fact:
    _baseline_fw_tags_by_dc_json: >-
      {%- set hosts = _baseline_fw_hosts_json | from_json -%}
      {%- set out = {} -%}
      {%- for h in hosts -%}
      {%- set dc = h.site -%}
      {{- out.update({dc: out.get(dc, {})}) or '' -}}
      {%- for t in h.tags -%}
      {{- out[dc].update({t: (out[dc].get(t, []) + [h.ip]) | reject('equalto', '') | unique | sort | list}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}
    _baseline_fw_tags_global_json: >-
      {%- set hosts = _baseline_fw_hosts_json | from_json -%}
      {%- set out = {} -%}
      {%- for h in hosts -%}
      {%- for t in h.tags -%}
      {{- out.update({t: (out.get(t, []) + [h.ip]) | reject('equalto', '') | unique | sort | list}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}
  run_once: true
  tags: [firewall, base]

- name: Decode the tag and prefix maps
  ansible.builtin.set_fact:
    baseline_fw_tags_by_dc: "{{ _baseline_fw_tags_by_dc_json | from_json }}"
    baseline_fw_tags_global: "{{ _baseline_fw_tags_global_json | from_json }}"
    baseline_fw_pools: "{{ (_baseline_fw_prefixes_json | from_json).pools }}"
    baseline_fw_nets: "{{ (_baseline_fw_prefixes_json | from_json).nets }}"
  run_once: true
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Every network this estate owns, from both the segments and the meshes.
#
#   baseline_network_segments_merged          fewest prefixes covering everything
#   baseline_network_segments                 exact per-segment prefixes, address-sorted
#   baseline_network_segments_by_dc           per datacenter, including `wg`
#   baseline_network_segments_trusted_merged  ...with the untrusted segments removed
#   baseline_network_segments_trusted         ditto, unmerged
#
# A segment is untrusted when it sets `trusted: false`, or when its name is
# in `firewall_untrusted_segments` (default: guest). Set the flag
# explicitly where the name does not give it away.
#
# This is segment-level. A site whose untrusted hosts live in a POOL of a
# trusted segment -- ez, where the work devices sit in 192.168.2.4/30 inside
# the default /24 -- cannot be expressed as a prefix list: removing a pool
# from the middle of a segment is a subtraction, not a filter. Those need
# a tag (baseline_fw_tags_*_device_soeren_work) or the pool variable itself.
#
# `baseline_network_segments_merged` is the one to reach for: an nft set, a
# route table, WireGuard AllowedIPs. It covers exactly what exists and no
# more -- unlike a hand-written supernet, where 192.168.64.0/21 silently
# reserves .64-.71 for a site that uses .64-.70, and 192.168.2.0/21 was not
# even a valid prefix (it normalises to 192.168.0.0/21).
#
# Add a VLAN and the merged list follows on the next run.
# ---------------------------------------------------------------------------

- name: Collect every network
  ansible.builtin.set_fact:
    _baseline_fw_segments_json: >-
      {%- set untrusted_names = firewall_untrusted_segments | default(['guest']) -%}
      {#- Which segments are untrusted: an explicit `trusted: false` on the
          device, else a name match. -#}
      {%- set untrusted = [] -%}
      {%- for dc, net in (networks | default({})).items() -%}
      {%- for dev in net.devices | default([]) -%}
      {%- set seg = dev.name | default(dev.device) | default('unnamed') -%}
      {%- if dev.address is defined -%}
      {%- if dev.trusted is defined -%}
      {%- if not dev.trusted -%}
      {{- untrusted.append(dc ~ '/' ~ seg) or '' -}}
      {%- endif -%}
      {%- elif seg in untrusted_names -%}
      {{- untrusted.append(dc ~ '/' ~ seg) or '' -}}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- set by_dc = {} -%}
      {%- set flat = [] -%}
      {%- set trusted_flat = [] -%}
      {%- for dc, segs in baseline_fw_nets.items() -%}
      {{- by_dc.update({dc: segs.values() | unique | list}) or '' -}}
      {%- for seg, cidr in segs.items() -%}
      {{- flat.append(cidr) or '' -}}
      {%- if (dc ~ '/' ~ seg) not in untrusted -%}
      {{- trusted_flat.append(cidr) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {#- address order, not string order: 192.168.2.0/24 belongs before
          192.168.100.0/24, which a plain sort gets wrong. -#}
      {%- set result = {} -%}
      {%- for label, source in [['all', flat], ['trusted', trusted_flat]] -%}
      {%- set keyed = [] -%}
      {%- for c in source | unique -%}
      {%- set o = c.split('/')[0].split('.') -%}
      {{- keyed.append('%03d.%03d.%03d.%03d/%02d|%s' | format(
            o[0] | int, o[1] | int, o[2] | int, o[3] | int,
            c.split('/')[1] | int, c)) or '' -}}
      {%- endfor -%}
      {%- set ordered = [] -%}
      {%- for k in keyed | sort -%}
      {{- ordered.append(k.split('|')[1]) or '' -}}
      {%- endfor -%}
      {{- result.update({label: ordered}) or '' -}}
      {%- endfor -%}
      {{- result.update({'by_dc': by_dc, 'untrusted': untrusted | sort}) or '' -}}
      {{ result | to_json }}
  run_once: true
  tags: [firewall, base]

- name: Publish the network lists
  ansible.builtin.set_fact:
    baseline_network_segments_merged: "{{ (_baseline_fw_segments_json | from_json).all | ansible.utils.cidr_merge }}"
    baseline_network_segments: "{{ (_baseline_fw_segments_json | from_json).all }}"
    baseline_network_segments_by_dc: "{{ (_baseline_fw_segments_json | from_json).by_dc }}"
    baseline_network_segments_trusted_merged: "{{ (_baseline_fw_segments_json | from_json).trusted | ansible.utils.cidr_merge }}"
    baseline_network_segments_trusted: "{{ (_baseline_fw_segments_json | from_json).trusted }}"
    baseline_network_segments_untrusted_names: "{{ (_baseline_fw_segments_json | from_json).untrusted }}"
  run_once: true
  tags: [firewall, base]

# ---------------------------------------------------------------------------
# Flat variables, so rule files stay readable
#
# Every tag known anywhere gets both a global and a local variable, so a
# rule referring to a tag absent from this datacenter renders as an empty set
# rather than failing on an undefined variable.
# ---------------------------------------------------------------------------

- name: Collect every tag name
  ansible.builtin.set_fact:
    _baseline_fw_all_tags: >-
      {{ ((baseline_fw_tags_global.keys() | list)
          + ((firewall_tag_groups | default({})).keys() | list)
          + ((firewall_tag_groups | default({})).values() | list | flatten)
          + (firewall_declared_tags | default([]))) | unique | list }}
  run_once: true
  tags: [firewall, base]

- name: Build the shared flat variable map
  ansible.builtin.set_fact:
    _baseline_fw_flat_json: >-
      {%- set out = {} -%}
      {%- set dcs = (baseline_fw_nets.keys() | list) + (baseline_fw_tags_by_dc.keys() | list) -%}
      {%- set dcs = dcs | unique | sort -%}
      {#- tags: per datacenter, global -#}
      {%- for t in _baseline_fw_all_tags -%}
      {%- set st = t | lower | regex_replace('[^a-z0-9]', '_') -%}
      {{- out.update({'baseline_fw_tags_global_' ~ st: baseline_fw_tags_global.get(t, [])}) or '' -}}
      {%- for dc in dcs -%}
      {%- set sdc = dc | lower | regex_replace('[^a-z0-9]', '_') -%}
      {{- out.update({'baseline_fw_tags_' ~ sdc ~ '_' ~ st: baseline_fw_tags_by_dc.get(dc, {}).get(t, [])}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {#- segments: per datacenter, global (global is a list) -#}
      {%- set seg_global = {} -%}
      {%- for dc, segs in baseline_fw_nets.items() -%}
      {%- set sdc = dc | lower | regex_replace('[^a-z0-9]', '_') -%}
      {%- for seg, cidr in segs.items() -%}
      {%- set sseg = seg | lower | regex_replace('[^a-z0-9]', '_') -%}
      {{- out.update({'baseline_fw_nets_' ~ sdc ~ '_' ~ sseg: cidr}) or '' -}}
      {{- seg_global.update({sseg: (seg_global.get(sseg, []) + [cidr]) | unique | sort | list}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {%- for sseg, cidrs in seg_global.items() -%}
      {{- out.update({'baseline_fw_nets_global_' ~ sseg: cidrs}) or '' -}}
      {%- endfor -%}
      {#- pools: per datacenter, global (global is a list) -#}
      {%- set pool_global = {} -%}
      {%- for dc, segs in baseline_fw_pools.items() -%}
      {%- set sdc = dc | lower | regex_replace('[^a-z0-9]', '_') -%}
      {%- for seg, pools in segs.items() -%}
      {%- set sseg = seg | lower | regex_replace('[^a-z0-9]', '_') -%}
      {%- for pname, cidr in pools.items() -%}
      {%- set sp = sseg ~ '_' ~ (pname | lower | regex_replace('[^a-z0-9]', '_')) -%}
      {{- out.update({'baseline_fw_pools_' ~ sdc ~ '_' ~ sp: cidr}) or '' -}}
      {{- pool_global.update({sp: (pool_global.get(sp, []) + [cidr]) | unique | sort | list}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- for sp, cidrs in pool_global.items() -%}
      {{- out.update({'baseline_fw_pools_global_' ~ sp: cidrs}) or '' -}}
      {%- endfor -%}
      {{ out | to_json }}
  run_once: true
  tags: [firewall, base]

# Published one key at a time. Handing set_fact a whole templated dict as
# free-form args does not reliably expand into individual facts, and the
# failure is silent: the dict renders fine, the variables never appear, and
# the first thing that references one fails with "is undefined".
- name: Publish the shared flat variables
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _baseline_fw_flat_json | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  tags: [firewall, base]

# Cheap, and it turns a silent publish failure into a named one.
#
# `varnames` rather than the internal `vars` dict, which is deprecated and
# goes away in ansible-core 2.24.
- name: Verify every shared flat variable is actually defined
  ansible.builtin.assert:
    that:
      - (_baseline_fw_flat_json | from_json).keys() | difference(_baseline_fw_defined) | length == 0
    fail_msg: |
      These were computed but never published as variables:
      {% for k in (_baseline_fw_flat_json | from_json).keys() | difference(_baseline_fw_defined) | sort %}
        {{ k }}
      {% endfor %}
    quiet: true
  vars:
    _baseline_fw_defined: "{{ query('varnames', '^baseline_fw_(nets|pools|tags)_') }}"
  run_once: true
  tags: [firewall, base]

# ===========================================================================
# PER HOST: this host's datacenter and its `local` views
# ===========================================================================

# `datacenter` names this host's site and matches a key of `networks`. A host
# that does not set it falls back to the second label of its FQDN when that
# names a real site -- auth.dd.soeren.cloud -> dd. Failing both,
# baseline_fw_datacenter is an empty string and every baseline_fw_*_local
# fact is simply empty, rather than the play blowing up on an undefined
# variable.
- name: Resolve this host's datacenter
  ansible.builtin.set_fact:
    baseline_fw_datacenter: >-
      {{ (datacenter | default('') | string)
         or (_baseline_fw_dc_guess if _baseline_fw_dc_guess in (networks | default({})).keys() | list else '') }}
  vars:
    _baseline_fw_dc_guess: "{{ (inventory_hostname.split('.') + [''])[1] }}"
  tags: [firewall, base]

- name: Warn when the datacenter could not be resolved
  ansible.builtin.debug:
    msg: >-
      No datacenter resolved for {{ inventory_hostname }}: `datacenter` is
      unset and no label of the hostname matches a key of `networks`. Every
      baseline_fw_*_local fact will be empty. Set `datacenter` in group_vars.
  when: baseline_fw_datacenter | default('') | length == 0
  tags: [firewall, base]

- name: Narrow the tag map to this datacenter
  ansible.builtin.set_fact:
    baseline_fw_tags_local: "{{ baseline_fw_tags_by_dc.get(baseline_fw_datacenter | default(''), {}) }}"
  tags: [firewall, base]

- name: Narrow the prefix maps to this datacenter
  ansible.builtin.set_fact:
    baseline_fw_pools_local: "{{ baseline_fw_pools.get(baseline_fw_datacenter | default(''), {}) }}"
    baseline_fw_nets_local: "{{ baseline_fw_nets.get(baseline_fw_datacenter | default(''), {}) }}"
  tags: [firewall, base]

- name: Build the local flat variable map
  ansible.builtin.set_fact:
    _baseline_fw_flat_local_json: >-
      {%- set out = {} -%}
      {%- for t in _baseline_fw_all_tags -%}
      {%- set st = t | lower | regex_replace('[^a-z0-9]', '_') -%}
      {{- out.update({'baseline_fw_tags_local_' ~ st: baseline_fw_tags_local.get(t, [])}) or '' -}}
      {%- endfor -%}
      {%- for seg, cidr in baseline_fw_nets_local.items() -%}
      {%- set sseg = seg | lower | regex_replace('[^a-z0-9]', '_') -%}
      {{- out.update({'baseline_fw_nets_local_' ~ sseg: cidr}) or '' -}}
      {%- endfor -%}
      {%- for seg, pools in baseline_fw_pools_local.items() -%}
      {%- set sseg = seg | lower | regex_replace('[^a-z0-9]', '_') -%}
      {%- for pname, cidr in pools.items() -%}
      {%- set sp = sseg ~ '_' ~ (pname | lower | regex_replace('[^a-z0-9]', '_')) -%}
      {{- out.update({'baseline_fw_pools_local_' ~ sp: cidr}) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}
  tags: [firewall, base]

- name: Publish the local flat variables
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _baseline_fw_flat_local_json | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [firewall, base]

- name: Verify every local flat variable is actually defined
  ansible.builtin.assert:
    that:
      - (_baseline_fw_flat_local_json | from_json).keys() | difference(_baseline_fw_defined) | length == 0
    fail_msg: |
      These were computed but never published as variables:
      {% for k in (_baseline_fw_flat_local_json | from_json).keys() | difference(_baseline_fw_defined) | sort %}
        {{ k }}
      {% endfor %}
    quiet: true
  vars:
    _baseline_fw_defined: "{{ query('varnames', '^baseline_fw_(nets|pools|tags)_local_') }}"
  tags: [firewall, base]

# Output is built as a LIST of lines, not one multi-line string: Ansible's
# default stdout callback renders a string with literal \n escapes, which is
# unreadable at this size. A list prints one element per line.
#
# For nicer output still, set `stdout_callback = yaml` in ansible.cfg.
#
#   baseline_fw_debug: true             everything: this datacenter, every
#                                       other datacenter, and the global scope
#   baseline_fw_debug_scope: local      narrow it to this datacenter only
- name: Build the debug output
  ansible.builtin.set_fact:
    _baseline_fw_debug_json: >-
      {#- Read the PUBLISHED variables, not the computed maps: the debug
          output must not be able to show a name that is not actually
          defined. `varnames`/`vars` lookups, not the deprecated internal
          dict. -#}
      {%- set defined = query('varnames', '^baseline_fw_(nets|pools|tags)_') -%}
      {%- set flat = {} -%}
      {%- for k in ((_baseline_fw_flat_json | from_json) | combine(_baseline_fw_flat_local_json | from_json)).keys() | sort -%}
      {%- if k in defined -%}
      {{- flat.update({k: lookup('vars', k)}) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- set dcs = ((baseline_fw_nets.keys() | list) + (baseline_fw_tags_by_dc.keys() | list)) | unique | sort -%}
      {%- set loc = baseline_fw_datacenter | default('') -%}
      {%- set w = 49 -%}
      {%- set pool_count = [] -%}
      {%- for dc, segs in baseline_fw_pools.items() -%}
      {%- for seg, pools in segs.items() -%}
      {{- pool_count.append(pools | length) or '' -}}
      {%- endfor -%}
      {%- endfor -%}
      {%- set local_pools = [] -%}
      {%- for seg, pools in baseline_fw_pools_local.items() -%}
      {{- local_pools.append(pools | length) or '' -}}
      {%- endfor -%}
      {%- set L = [] -%}
      {{- L.append('═' * 72) or '' -}}
      {{- L.append(' ' ~ inventory_hostname ~ '   ·   datacenter: ' ~ (loc if loc else '(unresolved)')) or '' -}}
      {{- L.append('═' * 72) or '' -}}
      {{- L.append('  datacenters   ' ~ dcs | join(', ')) or '' -}}
      {{- L.append('  tags          '
            ~ (flat.keys() | select('match', '^baseline_fw_tags_local_') | list | length) ~ ' known, '
            ~ (baseline_fw_tags_local | length) ~ ' with members here') or '' -}}
      {{- L.append('  segments      ' ~ (baseline_fw_nets_local | length) ~ ' here, '
            ~ (baseline_fw_nets.values() | map('length') | sum) ~ ' across all datacenters') or '' -}}
      {{- L.append('  pools         ' ~ (local_pools | sum) ~ ' here, '
            ~ (pool_count | sum) ~ ' across all datacenters') or '' -}}
      {%- set scopes = [['local_', 'local: ' ~ (loc if loc else 'none')]] -%}
      {%- if (baseline_fw_debug_scope | default('all')) == 'all' -%}
      {%- for dc in dcs -%}
      {{- scopes.append([(dc | lower | regex_replace('[^a-z0-9]', '_')) ~ '_', 'datacenter: ' ~ dc]) or '' -}}
      {%- endfor -%}
      {{- scopes.append(['global_', 'global (every datacenter)']) or '' -}}
      {%- endif -%}
      {%- for scope in scopes -%}
      {%- set sfx = scope[0] -%}
      {{- L.append('') or '' -}}
      {{- L.append('─── ' ~ scope[1] ~ ' ' ~ '─' * (68 - scope[1] | length)) or '' -}}
      {%- for kind in ['baseline_fw_nets_', 'baseline_fw_pools_', 'baseline_fw_tags_'] -%}
      {%- set keys = flat.keys() | select('match', '^' ~ kind ~ sfx) | sort | list -%}
      {%- set shown = [] -%}
      {%- for k in keys -%}
      {%- if flat[k] is string or flat[k] | length > 0 -%}
      {{- shown.append(k) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- if shown -%}
      {{- L.append('') or '' -}}
      {%- for k in shown -%}
      {{- L.append('  ' ~ '%-*s' | format(w, k) ~ '  '
            ~ (flat[k] if flat[k] is string else flat[k] | join(', '))) or '' -}}
      {%- endfor -%}
      {%- endif -%}
      {%- if kind == 'baseline_fw_tags_' -%}
      {%- set empties = [] -%}
      {%- for k in keys -%}
      {%- if flat[k] is not string and flat[k] | length == 0 -%}
      {{- empties.append(k | regex_replace('^baseline_fw_tags_' ~ sfx, '')) or '' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- if empties -%}
      {{- L.append('') or '' -}}
      {{- L.append('  no members: ' ~ empties | sort | join(', ')) or '' -}}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- if (baseline_fw_debug_scope | default('all')) != 'all' -%}
      {%- set hidden = flat | length - (flat.keys() | select('match', '^baseline_fw_[a-z]+_local_') | list | length) -%}
      {{- L.append('') or '' -}}
      {{- L.append('─── other scopes ' ~ '─' * 55) or '' -}}
      {{- L.append('  ' ~ hidden ~ ' more variables in scopes: '
            ~ (dcs | join(', ')) ~ ', global') or '' -}}
      {{- L.append('  drop -e baseline_fw_debug_scope=local to print them') or '' -}}
      {%- endif -%}
      {%- set closure = _baseline_fw_closure_json | from_json -%}
      {{- L.append('') or '' -}}
      {{- L.append('─── tag composition ' ~ '─' * 52) or '' -}}
      {%- if closure -%}
      {%- for tag, implied in closure | dictsort -%}
      {{- L.append('  ' ~ '%-*s' | format(w, tag) ~ '  -> ' ~ implied | join(', ')) or '' -}}
      {%- endfor -%}
      {%- else -%}
      {{- L.append('  (no firewall_tag_groups defined)') or '' -}}
      {%- endif -%}
      {{ L | to_json }}
  when: baseline_fw_debug | default(false) | bool
  tags: [firewall, base]

- name: Show the derived firewall facts
  ansible.builtin.debug:
    msg: "{{ _baseline_fw_debug_json | from_json }}"
  when: baseline_fw_debug | default(false) | bool
  tags: [firewall, base]
