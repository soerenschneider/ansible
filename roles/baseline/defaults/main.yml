---
baseline_mount_set_noatime: true
baseline_install_packages: true
baseline_packages: [acl, ca-certificates, git, gnupg2, moreutils, rsync, tar, tmux, unzip, vim, zsh]

baseline_systemd_journal_storage: "auto"
baseline_systemd_journal_system_max_use: "512M"
baseline_systemd_journal_system_max_file_size: "32M"
baseline_systemd_journal_runtime_max_use: "32M"
baseline_systemd_journal_runtime_max_file_size: "4M"

baseline_wol_enable: false
baseline_wol_device: "{{ ansible_default_ipv4.interface }}"


baseline_ssh_authorized_keys_soft_confine: true
baseline_ssh_authorized_keys_soft_from_default: from="192.168.0.0/16,10.0.0.0/8"

# authorized_keys, not stored on hardware tokens such as yubikey. these keys will get confined by 'from' on internal systems:
#   id: name of the key, mandatory
#   pub: the public key data, mandatory
#   opts: authorized_keys options, optional
#   from: when `baseline_ssh_authorized_keys_soft_confine` is True, use this value for the `from` parameter instead of using the fallback `baseline_ssh_authorized_keys_soft_from_default`.
baseline_authorized_keys_soft: []

# authorized_keys stored on hardware tokens (won't get automatically confined by 'from' on internal systems)
baseline_authorized_keys_hw: []


baseline_linux_sysctl_congestion_control: "bbr"
baseline_linux_sysctl_net_qdisc: "fq"

baseline_default_users_passwordless_sudo: true

baseline_firewall_enabled: true
baseline_firewall_nft_enabled: true

# Rules applied on every host, before baseline_firewall_rules. Same format.
baseline_firewall_base_rules:
  - comment: ssh
    ports: [22]
    proto: tcp

# Host/group specific rules.
#
#   - ports:   list of ports or ranges ("8000-8100" or ufw-style "8000:8100")
#     proto:   tcp (default) | udp | any
#     from:    list of IPv4 addresses or CIDRs (inbound is IPv4 only)
#              omitted or "any" -> open to everyone
#              empty list       -> rule is skipped (never opened to everyone)
#     comment: optional, shown in `nft list ruleset`
#     rate_limit: optional, new connections per source IP, e.g. "20/minute"
#                 (second|minute|hour|day). "none" turns the default off.
#     rate_burst: optional, extra connections allowed in a short spike
baseline_firewall_rules: []

# Default per-source-IP limit on new connections for every rule without its
# own rate_limit. "" = no limit. Established connections are never limited.
baseline_firewall_rate_limit: ""
baseline_firewall_rate_burst: 10
# Max. source addresses tracked per rate-limited rule; once full, new
# addresses are not admitted until old ones expire.
baseline_firewall_rate_limit_table_size: 65535


# Global IPv6 prefixes used inside LAN, e.g. ["2001:db8:1234::/48"].
# Outbound IPv6 to these, and to fc00::/7 (always included), is rejected.
# Only needed if hosts get global addresses from ISP prefix.
baseline_firewall_lan_ipv6_prefixes: []

# Ruleset file loaded by nftables.service. Empty = detect from os_family.
baseline_firewall_nftables_conf: ""
baseline_firewall_nftables_conf_by_os_family:
  Debian: /etc/nftables.conf
  RedHat: /etc/sysconfig/nftables.conf

# ufw (Debian) and firewalld (RHEL) must not manage the host alongside this.
baseline_firewall_disable_ufw: true
baseline_firewall_disable_firewalld: true

# Common location for public key material on every host (world-readable).
# One file per key: age, gpg, gpg_fingerprint.
# All key material lives under one root:
#   pubkeys/  0755  public keys, one file per key (age, gpg, gpg_fingerprint)
#   private/  0700  private keys (age.key, gnupg/)
baseline_dir: /etc/baseline
baseline_crypto_pubkey_dir: "{{ baseline_dir }}/pubkeys"
baseline_crypto_private_dir: "{{ baseline_dir }}/private"
baseline_facts_dir: /etc/ansible/facts.d

# age
baseline_age_auto_gen: true
baseline_age_force_keygen: false
baseline_age_bin: /usr/bin/age-keygen
baseline_age_key_path: "{{ baseline_crypto_private_dir }}/age.key"

# gpg
baseline_gpg_auto_gen: true
baseline_gpg_force_keygen: false
baseline_gpg_home: "{{ baseline_crypto_private_dir }}/gnupg"
# rsa4096 or ed25519 (ed25519 = EdDSA primary + cv25519 encryption subkey).
# Only affects newly generated keys; existing keys are left alone.
baseline_gpg_key_algo: rsa4096
baseline_gpg_uid: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"

# Controller path for the aggregated key map (e.g. a Terraform
# *.auto.tfvars.json). Empty string disables harvesting.
baseline_pubkey_harvest_file: ""
