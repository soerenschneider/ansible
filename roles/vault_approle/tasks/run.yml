---
- name: "Check if base directory exists"
  ansible.builtin.stat:
    path: "{{ item.secret_id_file | dirname }}"
  register: vault_approle_file_stat
  changed_when: false

- name: "Create base directory"
  ansible.builtin.file:
    path: "{{ item.secret_id_file | dirname }}"
    state: directory
    owner: "{{ item.secret_id_file_user }}"
    group: "{{ item.secret_id_file_group }}"
    mode: "0750"
  when: not vault_approle_file_stat.stat.exists

- name: "Create secret_id file if not existent"
  ansible.builtin.copy:
    dest: "{{ item.secret_id_file }}"
    content: ""
    force: false
    owner: "{{ item.secret_id_file_user }}"
    group: "{{ item.secret_id_file_group }}"
    mode: "0600"
  tags: [vault-approle, vault-approle-rotate]

- name: "Check if secret_id file exists"
  ansible.builtin.stat:
    path: "{{ item.secret_id_file }}"
  register: vault_approle_secret_id_file
  tags: [vault-approle, vault-approle-rotate]

- name: "Try login with existing credentials"
  ansible.builtin.shell: |
    set -o pipefail
    printf '{"role_id":"%s","secret_id":"%s"}' "$ROLE_ID" "$(cat "$SECRET_ID_FILE")" \
      | curl -sS --fail -X POST --data @- "$VAULT_ADDR/v1/auth/approle/login"
  args:
    executable: /bin/bash
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    ROLE_ID: "{{ item.role_name }}"
    SECRET_ID_FILE: "{{ item.secret_id_file }}"
  when: vault_approle_secret_id_file.stat.exists and vault_approle_secret_id_file.stat.size > 0
  register: vault_approle_login
  changed_when: false
  failed_when: false
  no_log: true
  tags: [vault-approle, vault-approle-rotate]

- name: "Revoke token from test login"
  ansible.builtin.shell: |
    set -o pipefail
    printf 'X-Vault-Token: %s\n' "$VAULT_TOKEN" \
      | curl -sS --fail -X POST -H @- "$VAULT_ADDR/v1/auth/token/revoke-self"
  args:
    executable: /bin/bash
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ (vault_approle_login.stdout | from_json).auth.client_token }}"
  when:
    - vault_approle_login is not skipped
    - vault_approle_login.rc == 0
  changed_when: true
  no_log: true
  tags: [vault-approle, vault-approle-rotate]

- name: "Rotate secret_id"
  when: vault_approle_force_rotate | bool or (vault_approle_login.skipped is defined or "rc" in vault_approle_login and vault_approle_login.rc != 0)
  tags: [vault-approle, vault-approle-rotate]
  block:
    - name: "Create new wrapped secret_id"
      ansible.builtin.command:
        argv: >-
          {{ ['sc', 'bao', '-a', vault_addr, '--quiet', 'approle', 'rotate-secret-id', '--json']
             + ['--role=' ~ item.role_name, '--wrap-ttl=1800', '--force'] }}
      register: vault_approle_secret_id_output
      become: false
      delegate_to: localhost
      changed_when: true

    - name: "Extract data from response"
      ansible.builtin.set_fact:
        vault_approle_wrapped_token: "{{ (vault_approle_secret_id_output.stdout | from_json).wrapping_token }}"
      become: false
      delegate_to: localhost

    - name: "Store wrapped secret_id"
      ansible.builtin.copy:
        content: "{{ vault_approle_wrapped_token }}"
        dest: "{{ item.secret_id_file }}"
        owner: "{{ item.secret_id_file_user }}"
        group: "{{ item.secret_id_file_group }}"
        mode: "0600"
      when: not (item.unwrap_before_save | default(true))

    - name: "Unwrap secret ID"
      ansible.builtin.shell: |
        set -o pipefail
        printf 'X-Vault-Token: %s\n' "$VAULT_TOKEN" \
          | curl -sS --fail -X POST -H @- "$VAULT_ADDR/v1/sys/wrapping/unwrap"
      args:
        executable: /bin/bash
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
        VAULT_TOKEN: "{{ vault_approle_wrapped_token }}"
      register: vault_approle_unwrap
      changed_when: true
      no_log: true
      when: item.unwrap_before_save | default(true)

    - name: "Store unwrapped secret ID to file"
      ansible.builtin.copy:
        content: "{{ (vault_approle_unwrap.stdout | from_json).data.secret_id }}"
        dest: "{{ item.secret_id_file }}"
        owner: "{{ item.secret_id_file_user }}"
        group: "{{ item.secret_id_file_group }}"
        mode: "0600"
      no_log: true
      when: item.unwrap_before_save | default(true)
