---
- name: "Stop sc-agent"
  ansible.builtin.systemd:
    name: "sc-agent"
    state: "stopped"
  failed_when: false

- name: "Rotate secret"
  ansible.builtin.include_tasks: run.yml
  loop: "{{ openbao_approle_clients }}"
  loop_control:
    label: "{{ item.role_name }}"
  tags: [vault-approle, vault-approle-install, vault-approle-rotate]

- name: "Restart sc-agent"
  ansible.builtin.systemd:
    name: "sc-agent"
    state: "restarted"
  failed_when: false
